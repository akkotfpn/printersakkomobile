name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk akkos-print.apk
      - uses: actions/upload-artifact@v4
        with:
          name: akkos-print-apk
          path: akkos-print.apk
      - name: Publish release (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" akkos-print.apk \
            --title "Akko's Print — build ${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --latest
